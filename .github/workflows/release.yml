name: Desktop release

on:
  push:
    tags: ["v*"]
  # Manual runs are the dress rehearsal: artifact-only (Windows/Linux
  # unsigned, macOS ad-hoc signed, never notarized), and they NEVER create
  # a release. Run one on main before pushing a tag.
  workflow_dispatch:

permissions:
  contents: read

# Serialize separate runs for the same ref; never cancel an upload in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Tag must match package.json
        if: github.event_name == 'push'
        run: |
          # shellcheck disable=SC2016 # ${version} is JavaScript, not shell
          node --input-type=module -e '
            import fs from "node:fs";
            const {version} = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              console.error("Release tag must equal v" + version);
              process.exit(1);
            }
          '
      # The tag's CHANGELOG.md section becomes the release body. A tag without
      # one fails here, before anything is built.
      - name: Release notes from CHANGELOG.md
        id: notes
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          notes=$(npx tsx scripts/release-notes.ts "${GITHUB_REF_NAME#v}")
          delimiter="NOTES_$(openssl rand -hex 8)"
          {
            echo "notes<<$delimiter"
            printf '%s\n' "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  draft:
    name: Prepare one draft
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # This job succeeds without creating anything on manual rehearsals.
      # Preparing once avoids the publisher's list-miss/create race between OS jobs.
      - name: Create or reuse the tag's draft
        if: github.event_name == 'push'
        uses: actions/github-script@v9
        env:
          NOTES: ${{ needs.quality.outputs.notes }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = context.ref.replace(/^refs\/tags\//, "");
            const version = tag.slice(1);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const matches = releases.filter(release =>
              release.tag_name === tag || release.tag_name === version);
            if (matches.length > 1) {
              throw new Error(`Multiple releases match ${tag}; resolve them before uploading.`);
            }
            if (matches.length === 1) {
              if (!matches[0].draft) {
                throw new Error(`${tag} is already published; refusing to modify it.`);
              }
              core.info(`Reusing draft ${matches[0].id} for ${tag} (title and notes unchanged)`);
              return;
            }
            const notes = (process.env.NOTES ?? "").trim();
            if (notes === "") {
              throw new Error(`No CHANGELOG.md notes for ${version} reached this job.`);
            }
            // electron-builder's publisher only uploads into an existing
            // draft, so the title and body set here are what ships.
            const body = [
              notes,
              "",
              "---",
              "",
              `First launch on each OS: see [Download](https://github.com/${owner}/${repo}#download).`,
              "",
              "Check that a download was built by this repository's release workflow:",
              "",
              "```sh",
              `gh attestation verify <downloaded file> -R ${owner}/${repo}`,
              "```",
            ].join("\n");
            const {data} = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: `Cairn ${version}`, body, draft: true,
            });
            core.info(`Created draft ${data.id} for ${tag}`);

  package:
    name: Package (${{ matrix.platform }})
    needs: [quality, draft]
    permissions:
      contents: write
      # Build provenance: a Sigstore-signed attestation for each installer.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: mac-arm64
            builder_args: --mac --arm64
            app: dist/mac-arm64/Cairn.app/Contents/MacOS/Cairn
            installers: "dist/*.dmg, dist/*.zip"
          - os: windows-2025
            platform: windows-x64
            builder_args: --win --x64
            app: dist/win-unpacked/Cairn.exe
            installers: "dist/*.exe"
          - os: ubuntu-24.04
            platform: linux-x64
            builder_args: --linux --x64
            app: dist/linux-unpacked/cairn-learn
            installers: "dist/*.AppImage, dist/*.deb"
    runs-on: ${{ matrix.os }}
    # Apple's notarization queue has taken ~2 hours for this team.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      # The mac icon is the Icon Composer document (build/icon.icon);
      # compiling it needs both macOS 26+ and actool ≥ 26 (Xcode 26+).
      # Xcode 26's asset compiler crashes on macOS 15's older frameworks.
      # Select the latest stable Xcode; no-op for Windows/Linux.
      - name: Select Xcode 26+ for actool (mac icon compile)
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      # MAC_SIGNING (repository variable) picks the macOS signature on tags:
      #   notarized (default): Developer ID + notarization. Needs the five
      #     secrets below and fails loudly without them.
      #   adhoc: an ad-hoc signature, no Apple account. Gatekeeper asks users
      #     to approve the first launch (Privacy & Security → Open Anyway).
      #     Squirrel.Mac refuses to update an ad-hoc app, so the build is
      #     stamped cairnUpdates=manual and electron/main.cjs turns in-app
      #     updates off; users download new versions themselves.
      # Rehearsals are always ad-hoc.
      - name: Choose the macOS signing mode
        id: mac-signing
        if: runner.os == 'macOS'
        env:
          MAC_SIGNING: ${{ vars.MAC_SIGNING }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            echo "Rehearsal: ad-hoc signature, no notarization."
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mode="${MAC_SIGNING:-notarized}"
          case "$mode" in
            notarized)
              for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
                if [[ -z "${!name}" ]]; then
                  echo "::error::Missing signing/notarization secret: $name (or set the repository variable MAC_SIGNING=adhoc to ship an ad-hoc signed build)"
                  exit 1
                fi
              done
              ;;
            adhoc)
              echo "::warning::MAC_SIGNING=adhoc: this macOS build is ad-hoc signed and not notarized. First launch needs Privacy & Security → Open Anyway, and updates are manual downloads."
              ;;
            *)
              echo "::error::MAC_SIGNING must be notarized or adhoc, not '$mode'"
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Signed and notarized macOS release → draft
        if: github.event_name == 'push' && runner.os == 'macOS' && steps.mac-signing.outputs.mode == 'notarized'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder ${{ matrix.builder_args }} --publish always -c.forceCodeSigning=true
      - name: Ad-hoc signed macOS release → draft (not notarized, manual updates)
        if: github.event_name == 'push' && runner.os == 'macOS' && steps.mac-signing.outputs.mode == 'adhoc'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.builder_args }} --publish always -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false -c.extraMetadata.cairnUpdates=manual
      - name: Windows/Linux release → draft
        if: github.event_name == 'push' && runner.os != 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.builder_args }} --publish always
      - name: Ad-hoc signed macOS rehearsal (no publish, no notarization)
        if: github.event_name == 'workflow_dispatch' && runner.os == 'macOS'
        run: npx electron-builder ${{ matrix.builder_args }} --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false -c.extraMetadata.cairnUpdates=manual
      - name: Windows/Linux rehearsal (no publish)
        if: github.event_name == 'workflow_dispatch' && runner.os != 'macOS'
        run: npx electron-builder ${{ matrix.builder_args }} --publish never
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-arm64/Cairn.app
          codesign -dv --verbose=4 dist/mac-arm64/Cairn.app 2>&1 | grep -E '^(Identifier|Format|CodeDirectory|Signature|Authority|TeamIdentifier|Runtime)'
      - name: Ad-hoc builds ship with in-app updates off
        if: runner.os == 'macOS' && steps.mac-signing.outputs.mode == 'adhoc'
        run: |
          node -e '
            const asar = require("@electron/asar");
            const archive = "dist/mac-arm64/Cairn.app/Contents/Resources/app.asar";
            const meta = JSON.parse(asar.extractFile(archive, "package.json").toString("utf8"));
            if (meta.cairnUpdates !== "manual") {
              console.error(archive + ": package.json lacks cairnUpdates=manual");
              process.exit(1);
            }
            console.log("app.asar package.json: cairnUpdates=" + meta.cairnUpdates);
          '
      - name: Initialize packaged providers offline (host and packaged Electron Node)
        run: |
          case "$RUNNER_OS" in
            macOS)
              app="dist/mac-arm64/Cairn.app/Contents"
              payload="$app/Resources/server/standalone"
              runtime="$app/MacOS/Cairn"
              ;;
            Windows)
              payload="dist/win-unpacked/resources/server/standalone"
              runtime="dist/win-unpacked/Cairn.exe"
              ;;
            Linux)
              payload="dist/linux-unpacked/resources/server/standalone"
              runtime="dist/linux-unpacked/cairn-learn"
              ;;
          esac
          node scripts/smoke-provider-runtime.mjs --standalone "$payload"
          node scripts/smoke-provider-runtime.mjs --standalone "$payload" --runtime "$runtime"
      - name: Exercise packaged demo runtime (own Electron, no system Chrome)
        run: |
          case "$RUNNER_OS" in
            macOS)
              app="dist/mac-arm64/Cairn.app/Contents"
              node scripts/smoke-demo-runtime.mjs --standalone "$app/Resources/server/standalone" --runtime "$app/MacOS/Cairn" --browser
              ;;
            Windows)
              node scripts/smoke-demo-runtime.mjs --standalone dist/win-unpacked/resources/server/standalone --runtime dist/win-unpacked/Cairn.exe --browser
              ;;
            Linux)
              xvfb-run -a node scripts/smoke-demo-runtime.mjs --standalone dist/linux-unpacked/resources/server/standalone --runtime dist/linux-unpacked/cairn-learn --browser
              ;;
          esac
      # Launches the real packaged app, waits for its window to render the
      # home page, and saves a dark and a light screenshot.
      - name: Open the packaged app window (dark and light)
        env:
          APP: ${{ matrix.app }}
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" node scripts/smoke-window.mjs --app "$APP" --out dist/smoke
          else
            node scripts/smoke-window.mjs --app "$APP" --out dist/smoke
          fi
      # Verify a download with: gh attestation verify <file> -R <owner>/<repo>
      - name: Attest installer provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ matrix.installers }}
      - name: Save installers and update metadata
        uses: actions/upload-artifact@v7
        with:
          name: cairn-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
      - name: Save window screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: window-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: ignore
          path: dist/smoke

  # The last gate before a human publishes: after ALL three packaging jobs
  # have uploaded, fail the run unless the tag's single draft release holds
  # exactly the 11 verified assets (4 installers + mac updater ZIP + their
  # blockmaps + 3 latest*.yml feeds) and the feeds reference those uploads
  # by exact name at the package.json version. Read-only: it never creates,
  # edits, publishes, or deletes anything. Manual rehearsals upload nothing,
  # so there is no draft to verify and the job stays skipped.
  verify:
    name: Verify draft release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # GitHub hides drafts from tokens without push access. The commands below
    # remain GET-only; expose this token only to the two API-reading steps.
    permissions:
      contents: write
    steps:
      # The tagged revision — verify exactly what was packaged, not a moving default.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: List every release, drafts included
        env:
          GH_TOKEN: ${{ github.token }}
        # --slurp wraps the paginated pages into one JSON document
        # ([[release,...],[release,...]]); the validator flattens it.
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
      - name: Select the tag's single draft
        # Machine JSON on stdout (release id + asset ids); warnings on stderr.
        run: npx tsx scripts/verify-release.ts select "$RUNNER_TEMP/releases.json" --tag "$GITHUB_REF_NAME" > "$RUNNER_TEMP/draft.json"
      - name: Download the three update feeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/metadata"
          for name in latest-mac.yml latest.yml latest-linux.yml; do
            id=$(DRAFT="$RUNNER_TEMP/draft.json" NAME="$name" node -e '
              const fs = require("node:fs");
              const draft = JSON.parse(fs.readFileSync(process.env.DRAFT, "utf8"));
              const asset = draft.assets.find((entry) => entry.name === process.env.NAME);
              if (asset == null) { console.error("draft has no " + process.env.NAME); process.exit(1); }
              console.log(asset.id);
            ')
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H "Accept: application/octet-stream" > "$RUNNER_TEMP/metadata/$name"
            echo "downloaded $name ($(wc -c < "$RUNNER_TEMP/metadata/$name") bytes)"
          done
      - name: Verify draft assets and update feeds
        run: npx tsx scripts/verify-release.ts verify "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/metadata" --tag "$GITHUB_REF_NAME"
