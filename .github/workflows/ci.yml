name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Grades the recorded tutor transcripts; no model, no network.
      - run: npm run evals
      - run: npm run lint

  standalone:
    name: Standalone (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard macos-15 runners are Apple Silicon (not macos-15-intel).
          - os: macos-15
            platform: mac-arm64
          - os: windows-2025
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron

  a11y:
    name: Accessibility checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      # Headless only, so the headless shell is enough (the same binary the
      # baseline was recorded with).
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run build
      - run: node scripts/build-server.mjs
      - run: npm run test:a11y

  proof:
    name: Proof (review rating)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The Verus release verified/ is proved with. Bump it together with the
      # crate pins in verified/Cargo.toml and the Rust channel below
      # (verified/README.md, "Changing the rule").
      VERUS_VERSION: "0.2026.11.02.8bf68ee"
      VERUS_SHA256: "f3a0119292df8855e4435da8130bee1873b0e6a60c306accf81a08ea687bba3c"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      # The channel in verified/rust-toolchain.toml: the Rust that this
      # Verus release is built against.
      - run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown --no-self-update
      - name: Install Verus
        run: |
          zip="verus-${VERUS_VERSION}-x86-linux.zip"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$zip" "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/${zip}"
          echo "${VERUS_SHA256}  $RUNNER_TEMP/$zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP"
          echo "VERUS=$RUNNER_TEMP/verus-x86-linux/verus" >> "$GITHUB_ENV"
      # Prove, mutation check, build to WebAssembly, test, negative control.
      - run: node verified/check.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proof-receipt
          path: |
            verified/target/receipt.json
            verified/target/logs/
          retention-days: 14
          if-no-files-found: ignore

  docs:
    name: Docs links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Offline: every relative link and #fragment between repo files must
      # resolve. External URLs aren't fetched, so this never flakes.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --include-fragments
            '*.md' 'docs/**/*.md' '.github/**/*.md' 'skills/**/*.md' 'src/**/*.md' 'tests/**/*.md' 'verified/**/*.md'

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # actionlint also runs shellcheck on every run: block.
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
